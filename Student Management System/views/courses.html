<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduManage | Courses</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="admin-layout">
    <aside class="side-nav">
        <div class="logo"><i class="fas fa-graduation-cap"></i><span>EduManage</span></div>
        <nav class="nav-links">
            <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="index.html"><i class="fas fa-users"></i> Students</a>
            <a href="courses.html" class="active"><i class="fas fa-book"></i> Courses</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <h2>Course Management</h2>
            <div class="avatar-small">A</div>
        </header>

        <main class="dashboard-wrapper">
            <div class="two-col-grid">
                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-plus-circle"></i> Add Course</h3></div>
                    <form id="courseForm">
                        <div class="form-group">
                            <label>Course Title *</label>
                            <input type="text" id="courseTitle" class="form-control" placeholder="e.g. Data Structures" required>
                        </div>
                        <div class="form-group">
                            <label>Instructor Name</label>
                            <input type="text" id="courseInstructor" class="form-control" placeholder="Dr. Smith" required>
                        </div>
                        <div class="form-group">
                            <label>Duration (Years/Months)</label>
                            <input type="text" id="courseDuration" class="form-control" placeholder="3 Years" required>
                        </div>
                        <div class="form-group">
                            <label>Total Credits</label>
                            <input type="number" id="courseCredits" class="form-control" placeholder="120" required>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Course</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-book"></i> Course Catalog</h3></div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Course Code</th>
                                    <th>Title</th>
                                    <th>Instructor</th>
                                    <th>Credits</th>
                                </tr>
                            </thead>
                            <tbody id="courseTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="../js/courses.js"></script>
</body>
</html>

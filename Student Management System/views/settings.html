<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduManage | Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-layout">
    <aside class="side-nav">
        <div class="logo"><i class="fas fa-graduation-cap"></i><span>EduManage</span></div>
        <nav class="nav-links">
            <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="index.html"><i class="fas fa-users"></i> Students</a>
            <a href="courses.html"><i class="fas fa-book"></i> Courses</a>
            <a href="settings.html" class="active"><i class="fas fa-cog"></i> Settings</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <h2>System Settings</h2>
            <div class="avatar-small">A</div>
        </header>

        <main class="dashboard-wrapper">
            <div class="settings-grid">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-building"></i> Institution Profile</h3>
                    </div>
                    <form id="settingsForm">
                        <div class="form-group">
                            <label>Institution Name</label>
                            <input type="text" class="form-control" value="EduManage University" id="instName">
                        </div>
                        <div class="form-group">
                            <label>Support Email</label>
                            <input type="email" class="form-control" value="admin@edumanage.com" id="instEmail">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: auto;"><i class="fas fa-check"></i> Save Changes</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-bell"></i> Notifications & Security</h3>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" checked style="width: 18px; height: 18px;"> Enable Email Notifications for new enrollments
                        </label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" checked style="width: 18px; height: 18px;"> Require Two-Factor Authentication (Admin)
                        </label>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="../js/settings.js"></script>
</body>
</html>
